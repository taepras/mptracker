# Build the static site and publish it to GitHub Pages on every push to main.
#
# The database isn't in git (too big). It lives as a gzipped asset on the GitHub Release
# tagged "data" — upload a new one with pipeline/publish_db.sh after scraping + build_db.py.
# Run this workflow by hand (Actions tab → "Publish site" → Run workflow) to redeploy after a data update.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pipeline/export_site.py only needs the web app (Flask); scraping/tokenizing deps aren't required
      - run: pip install "flask>=3.0"

      - name: Download database from the "data" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data --repo "$GITHUB_REPOSITORY" --pattern mptracker.db.gz
          gunzip mptracker.db.gz

      - name: Export static site
        # Project sites are served from https://<user>.github.io/<repo>/
        run: python pipeline/export_site.py --base "/${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
